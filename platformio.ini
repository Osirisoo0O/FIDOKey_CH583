; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:genericCH583M]
platform = ch32v
board = genericCH583M
framework = noneos-sdk
upload_protocol = wch-link

; 自定义链接脚本：规划 Flash 分区（见 ldscripts/SecureKey_CH58x.ld、include/flash_layout.h）
board_build.ldscript = ldscripts/SecureKey_CH58x.ld

build_flags = 
    -D DEBUG=1
    ; 启用官方 HAL 按键服务：HAL_Init() 会调用 HAL_KeyInit()，
    ; 把 KEY1(PB22) / KEY2(PB4) 配置为上拉输入（UP 按键用 PB4 = KEY2）
    -D HAL_KEY=TRUE
    -D HAL_LED=TRUE
    ; 增大 BLE 控制器的数据包缓冲，从而抬高 ATT_MTU。
    ;   规则：ATT_MTU = BLE_BUFF_MAX_LEN - 4，范围 [27, 516] -> MTU [23, 512]
    ;   默认 27 -> MTU 23，意味着一次只能写 20 字节，FIDO 请求会被切得很碎。
    ;   取 100 -> MTU 96，单个 CTAP 请求（~65 字节）能一帧装下。
    ;   代价：每块缓冲多占 73 字节 RAM，共 5 块约 365 字节。
    -D BLE_BUFF_MAX_LEN=100
