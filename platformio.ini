; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:genericCH583M]
platform = ch32v
board = genericCH583M
framework = noneos-sdk
upload_protocol = wch-link

; 自定义链接脚本：规划 Flash 分区（见 ldscripts/SecureKey_CH58x.ld、include/flash_layout.h）
board_build.ldscript = ldscripts/SecureKey_CH58x.ld

build_flags = 
    -D DEBUG=1
    ; 启用官方 HAL 按键服务：HAL_Init() 会调用 HAL_KeyInit()，
    ; 把 KEY1(PB22) / KEY2(PB4) 配置为上拉输入（UP 按键用 PB4 = KEY2）
    -D HAL_KEY=TRUE
    -D HAL_LED=TRUE
